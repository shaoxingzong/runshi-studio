# ============================================================================
# 润石工作室官网 · Nginx 配置样例
#
# 放置位置：/etc/nginx/conf.d/runshi-studio.conf（或按你的发行版习惯调整），
# 改完 nginx -t 校验、systemctl reload nginx 生效。
#
# 本配置覆盖四件事：
#   ① 前端静态资源（web/dist 的构建产物）+ SPA fallback
#   ② /api 反向代理到 Spring Boot（带上真实 IP 头——考勤与限流都依赖它）
#   ③ /uploads 反向代理到后端（上传的图片由应用以静态资源方式提供）
#   ④ 安全响应头与传输压缩
#
# ⚠️ 改这个文件前必读的三条（都踩过坑）：
#   1) X-Real-IP / X-Forwarded-For 两个头**必须传**：后端考勤的「内外网判定」与
#      IP 限流靠它们拿真实客户端 IP。不传的后果是全员签到记「外网」、限流形同虚设。
#   2) 后端默认只信任来自 127.0.0.1 / ::1 的代理头（studio.attendance.trusted-proxies）。
#      本样例假设 **Nginx 与应用同机**；不同机时必须把 Nginx 地址加进
#      ATTENDANCE_TRUSTED_PROXIES 环境变量，否则后端起疑直接忽略这些头。
#   3) client_max_body_size 与后端 multipart 上限（10MB）保持一致，
#      设小了上传会在 Nginx 层就被截断（413），后端根本收不到请求。
# ============================================================================

server {
    listen 80;
    # TODO: 换成真实域名；确认 DNS 与证书就绪后打开下面的 443 整段
    server_name your-domain.com;

    # ===== 前端静态资源 =====
    # web/ 下 npm run build 的产物目录（按实际部署路径调整）
    root /opt/runshi-studio/web/dist;
    index index.html;

    # 带 hash 的构建产物（Vite 产出形如 index-a1b2c3d4.js）内容永不变，可长缓存
    # ⚠️ 这里刻意只用 expires、不写 add_header：Nginx 的 add_header 只在「当前层级
    # 没有自己的 add_header」时才继承上层。一旦在这个 location 里加一条 add_header，
    # 下面 server 级的 CSP / X-Frame-Options / nosniff 会**全部失效**。
    # expires 是独立指令，不参与 add_header 的继承判断，既能设缓存又能保住安全头。
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # 入口 HTML 不缓存：否则发布新版本后用户还在读旧页面（接口结构可能已变）。
    # 同上，用 expires 而不是 add_header，保证 index.html 也带上安全响应头。
    location = /index.html {
        expires -1;
    }

    # SPA fallback：路由是 history 模式，任何未匹配静态文件的路径都回 index.html，
    # 由前端路由接管。少了这一行，用户直接访问 /posts/123 会得到 Nginx 的 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 后端 API =====
    location /api/ {
        proxy_pass http://127.0.0.1:8080;   # 不带尾斜杠：/api/xxx 原样转发
        proxy_http_version 1.1;

        # 真实 IP 头（见文件开头第 1 条）：考勤判定与 IP 限流的数据来源
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Host / 协议 / 端口三件套：后端靠它们判断「浏览器眼里是否同源」。
        # 只传 Host + Proto 时，HTTPS 站点的同源 POST 会被后端判成跨域并返回 403
        # （登录、发帖、上传全线失败，而 GET 正常，极难排查）。三者必须齐全。
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # SSE 流式接口（AI 助手）必须关掉缓冲，否则字攒在一起一次性出来
        proxy_buffering off;
        proxy_cache off;
        # 流式回答最长约 60s，读超时留足余量
        proxy_read_timeout 120s;

        client_max_body_size 10m;
    }

    # ===== 上传的图片 =====
    # 后端以静态资源方式提供 /uploads/**（已配置匿名可读）
    # ⚠️ 后端 context-path 是 /api，静态映射的真实地址是 /api/uploads/**。
    # proxy_pass 必须补上 /api/uploads/ 这段 URI：只写 8080 会把 /uploads/x 原样
    # 转发成 /uploads/x，后端因缺少 /api 前缀直接 404 —— 表现就是全站图片裂图。
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080/api/uploads/;
        proxy_set_header Host $host;
        expires 30d;
        client_max_body_size 10m;
    }

    # ===== 传输压缩 =====
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    gzip_min_length 1k;
    # 已经压过的格式别再压（图片/字体），纯属浪费 CPU
    gzip_disable "msie6";

    # ===== 安全响应头 =====
    # 防点击劫持：本站没有被合法 iframe 嵌入的场景
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 防 MIME 嗅探：扩展名说了算，别让浏览器猜
    add_header X-Content-Type-Options "nosniff" always;
    # 站外跳转时不带完整 URL（避免 token 随 query 泄露——站点自己的埋点也剥 query）
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP 基线：够用且不会把站点搞坏。等将来没有内联脚本后，把 script-src 的
    # 'unsafe-inline' 去掉、改用 nonce——那才是 CSP 防 XSS 的完全体。
    # （当前放宽 style-src 是因为 ECharts 会写内联样式；img-src 放 data: 同因。）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self'" always;

    # 日志（按站点分文件，排障时不用在 access.log 里翻）
    access_log /var/log/nginx/runshi-studio.access.log;
    error_log  /var/log/nginx/runshi-studio.error.log;
}

