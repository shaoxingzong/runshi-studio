# ============================================================================
# 开发环境 —— 只写「与全局默认不同」的几项
#
# 公共配置（数据源 / Redis / AI 参数 / Sa-Token / MyBatis-Plus 等）都在 application.yml，
# 这里只放开发环境特有的：打开接口文档、打开调试日志。
#
# 真实密钥放 application-local.yml（不进 Git），不要写在这里。
# ============================================================================

knife4j:
  # 接口文档增强 UI：http://localhost:8080/api/doc.html
  # （生产保持关闭——那一行在 application.yml 里，是刻意的安全默认值）
  enable: true

springdoc:
  api-docs:
    enabled: true

sa-token:
  # 鉴权日志：排查「为什么这个请求被判未登录」时很有用；生产关闭
  is-log: true

logging:
  level:
    # 开发时打印 SQL 与调试日志
    com.bhu.runshistudioweb: debug

studio:
  attendance:
    # 工作室 WiFi「BeiHua-RunShi」的网段（2026-10-23 实测，非占位值）。
    # 取证方式：WLAN 网卡（Intel AX201）的 DHCP 租约
    #   DhcpIPAddress=192.168.1.117  DhcpSubnetMask=255.255.255.0  DhcpDefaultGateway=192.168.1.1
    #   → 192.168.1.117 & 255.255.255.0 = 192.168.1.0，掩码 255.255.255.0 即 /24
    # 网段若变了（换了路由器 / 学校重新规划地址），重连该 WiFi 后按上面的方法重取。
    # 多个网段可并列写多行；命中任意一个即判为内网
    lan-cidrs:
      - 192.168.1.0/24
