# ============================================================================
# 开发环境 —— 只写「与全局默认不同」的几项
#
# 公共配置（数据源 / Redis / AI 参数 / Sa-Token / MyBatis-Plus 等）都在 application.yml，
# 这里只放开发环境特有的：打开接口文档、打开调试日志。
#
# 真实密钥放 application-local.yml（不进 Git），不要写在这里。
# ============================================================================

knife4j:
  # 接口文档增强 UI：http://localhost:8080/api/doc.html
  # （生产保持关闭——那一行在 application.yml 里，是刻意的安全默认值）
  enable: true

springdoc:
  api-docs:
    enabled: true

sa-token:
  # 鉴权日志：排查「为什么这个请求被判未登录」时很有用；生产关闭
  is-log: true

logging:
  level:
    # 开发时打印 SQL 与调试日志
    com.bhu.runshistudioweb: debug
