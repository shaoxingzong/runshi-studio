# ============================================================================
# 全局默认 + 各环境公共配置
#
# <b>为什么不全塞进 dev / prod 两份文件里</b>：
#   - 这里放「所有环境都一样」的配置，以及「安全默认值」；
#   - application-dev.yml / application-prod.yml 只写**真正不同**的几项；
#   - application-local.yml（不进 Git）放个人本机的真实密钥。
#   这样两个环境文件的差异一眼可见，而不是两份长文件逐行对比。
#
# <b>安全默认值原则</b>：凡是「开了有风险」的开关（接口文档、鉴权日志、调试日志），
# 一律在这里写成**关闭**，再由 dev profile 显式打开。
# 这样将来新增任何 profile 而忘了配置时，结果是「安全」而不是「侥幸」。
# ============================================================================

spring:
  application:
    # 应用名：日志、链路追踪、注册中心都会用它标识服务
    name: runshi-studio-web
  profiles:
    # 激活的环境；部署时用 --spring.profiles.active=prod 覆盖，不要改这里的值
    active: dev

  # 本地私有配置（不进 Git）：个人本机的真实密钥写在这里。
  # optional: 文件不存在也不报错——别人拉下代码无需创建即可启动
  config:
    import: optional:classpath:application-local.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/studio_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    # ⚠️ 刻意**不给默认值**：口令属于私密信息。写死在仓库里（哪怕只是本地开发用的弱口令）
    #    既会被安全扫描工具告警，也等于把「本机数据库的默认口令」公开出去。
    #  → 本地：写在 application-local.yml（不进 Git），或用环境变量 MYSQL_PASSWORD 提供；
    #  → 生产：由 application-prod.yml 的 ${MYSQL_PASSWORD} 从 app.env 注入。
    # 没有默认值意味着「忘记配置 = 启动即失败」，而不是「侥幸连上」——这是有意的。
    password: ${MYSQL_PASSWORD}

  servlet:
    multipart:
      max-file-size: 10MB       # 框架层限制：单个文件最大 10MB
      max-request-size: 10MB    # 框架层限制：整个请求最大 10MB

  # ===== 虚拟线程（JDK 21）=====
  # Tomcat 的请求处理改用「一请求一线程」的虚拟线程，替代 200 个平台线程的池。
  # 为什么适合本项目：接口几乎全是 I/O 等待型——MySQL 查询、Redis 限流计数、
  # 外部 AI 的 HTTP 调用（AI 咨询接口一次提问要等模型几秒到几十秒）。
  # 这类负载下虚拟线程的吞吐与并发上限远高于平台线程池，且内存代价可忽略。
  #
  # ⚠️ JDK 21 的注意点：synchronized 块内做阻塞 I/O 会「钉住」载体线程，
  #    虚拟线程的优势会打折。本项目主代码已核查为零 synchronized（并发控制
  #    全部用 ConcurrentHashMap / Redis 原子操作），第三方依赖（Sa-Token /
  #    MyBatis-Plus）同样不在 synchronized 里做 I/O，因此安全。
  #
  # ⚠️ 开了它不等于并发无上限：数据库连接的真实闸门是 HikariCP 连接池
  #    （默认 10，未显式配置）。并发请求会从「排队等线程」变成「排队等连接」，
  #    行为更优（不占内存），但 2 核 2G 上不要顺手把池调大——每个 MySQL
  #    连接服务端要占几 MB，池越大内存越紧。
  threads:
    virtual:
      enabled: true

  # Redis（Spring Boot 4 的前缀是 spring.data.redis；Boot 2 的 spring.redis 已废弃）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 同 datasource.password：刻意不给默认值，本地由 application-local.yml 或
      # 环境变量 REDIS_PASSWORD 提供（理由见上方注释）
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3000ms                # Redis 卡住时快速失败，而不是一直挂着
      connect-timeout: 3000ms        # Redis 未启动立刻报错，不用等系统默认重试
      lettuce:
        shutdown-timeout: 200ms
        pool:
          enabled: true              # 生效前提：classpath 上有 commons-pool2（已加入 pom）
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms           # 不用 -1（无限等待）

server:
  port: 8080
  servlet:
    # 统一前缀：所有接口挂在 /api 下，便于 Nginx 按前缀转发、与前端静态资源区分
    context-path: /api

studio:
  file:
    # 上传根目录：必须是**绝对路径**，且与 WebMvcConfig 的 /uploads/** 映射是同一个值。
    # 不写相对路径：相对路径以「进程工作目录」为基准，本地跑与打成 jar 后指向不同位置，
    # 表现为「本地能看到图、部署后图片全 404」。生产由 prod profile 覆盖为 Linux 路径
    root-dir: ${FILE_ROOT_DIR:D:/runshi-studio-upload}

  # ===== AI 咨询（OpenAI 兼容协议，服务商可替换）=====
  ai:
    # 以下四项在生产被覆盖为「必填」；本地留空时应用照常启动，
    # 只有真正调用 AI 时返回 C0200「AI 服务暂时不可用」
    base-url: ${AI_BASE_URL:}                       # 不带 /chat/completions，由 AiManager 拼接
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    # 想不改包换话术：设为 file:/opt/.../system-prompt.txt
    system-prompt-location: ${AI_SYSTEM_PROMPT_LOCATION:classpath:prompts/system-prompt.txt}

    # 普通登录用户的提问次数上限（成员/管理员不限额、也不计数）；命中返回 A0501
    query-limit: 5
    # RAG 检索：最多取回多少条资料块（越多越全，但 token 与噪声同步上升）
    rag-top-k: 5
    # RAG 相似度下限：⚠️ 它是 relevance=(1+cos)/2 而**不是**余弦本身，
    #   0.5 = 正交（毫不相关）、0.75 ≈ 余弦 0.5；**越高越严格**，换向量模型后必须重新校准
    rag-min-score: 0.75
    # 配额增量回刷周期（毫秒）：Redis 若重启，最多丢这么多增量——所以 AOF 必须开
    query-count-flush-delay-ms: 60000
    # ===== 游客 IP 限流 =====
    # 游客没有身份、配额无从谈起，只能按 IP 兜底；登录用户不受此限（走用户配额）。
    # 开关：测试环境由 surefire 统一置 false（避免既有匿名用例被误杀），
    #       限流专项测试类用 @DynamicPropertySource 覆盖为 true
    guest-ip-minute-limit: 5
    guest-ip-daily-limit: 50
    guest-ip-limits-enabled: ${AI_GUEST_IP_LIMITS_ENABLED:true}

  # ===== 登录 / 注册防爆破限流 =====
  # 登录接口此前的状况：无验证码、无失败锁定、无任何频率限制——
  # 等于把「账号口令空间」开放给无限次尝试；注册接口还是账号存在性探测器。
  # 这里按 IP 兜底（与游客提问限流同一套 Lua 双窗口实现，见 manager/IpRateLimitManager）。
  # ⚠️ 它挡不住分布式慢速爆破（海量 IP 各试几次）——那个需要验证码 / 失败锁定，
  #    属于后续增强；当前先堵「单 IP 高频尝试」这个最常见形态。
  auth:
    rate-limit:
      # 总开关：测试环境由 surefire 置 false（MockMvc 下来源 IP 都是 127.0.0.1，
      # 不关的话既有登录/注册用例跑几个就集体 429，那是假失败）
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      # 登录：正常用户忘密码重试几次远达不到 10 次/分钟；爆破脚本则是每秒级尝试。
      # NAT 出口共享 IP 的场景（工作室多人同一出口）也远低于此限，不会误伤
      login-minute-limit: 10
      login-daily-limit: 100
      # 注册：比登录更严——注册是一次性行为，正常用户不会分钟级连续注册；
      # 且注册接口是账号存在性探测器，限流是防批量扫描的主要手段
      register-minute-limit: 5
      register-daily-limit: 20

    # ===== 登录失败锁定（账号级，与上面的 IP 限流互补）=====
    # 补的是 IP 限流挡不住的分布式慢速爆破：海量 IP 各试几次，
    # 频次远低于任何单 IP 上限，却能持续消耗目标账号的口令空间。
    # 触发条件是「同一账号连续失败 N 次」，与尝试来自哪个 IP 无关。
    # ⚠️ 只在「账号存在且密码错误」时计数——对不存在的账号锁定
    #    会让「已锁定」提示变成账号存在性探测器（manager/AuthLockManager）
    lock:
      # 总开关：测试环境由 surefire 置 false（既有登录类用例密集，不关会集体「已锁定」）
      enabled: ${AUTH_LOCK_ENABLED:true}
      # 窗口内连续失败 5 次即锁。正常用户忘密码连错 5 次是小概率事件；
      # 再低会误抓真忘密码的用户，再高则给爆破更多空间
      max-failures: 5
      # 锁定时长（分钟），同时是计数 key 的 TTL：从第一次失败起算，
      # 过期自动恢复。刻意不用「每次失败续期」——那会让攻击者
      # 每 14 分钟试一次就把账号永久锁死（DoS）
      lock-minutes: 15

  # ===== 考勤签到 =====
  attendance:
    # 工作室局域网网段：命中任一即判为「内网签到」。
    # 留空时应用照常启动，但启动日志会打一条 warn，且**所有签到都记为外网**——
    # 这是刻意选的安全侧默认：宁可记录不准，也不能把未知地址当成内网发通行证。
    # 取值方式：在工作室电脑上执行 ipconfig，用 IPv4 地址 + 子网掩码推出
    # （掩码 255.255.255.0 对应 /24）。真实网段由 dev / prod 环境覆盖，这里刻意留空
    lan-cidrs: []
    # 可信反向代理：只有 TCP 对端是这些地址时，才采信 X-Real-IP / X-Forwarded-For。
    # ⚠️ 这是防「伪造内网签到」的安全根基——请求头是客户端可以任意伪造的，
    #    少了这道判断，任何人加一个 X-Real-IP: 192.168.1.5 就能让自己「在工作室签到」。
    # 默认只信本机（即 Nginx 与应用同机这一最常见形态）；Nginx 在别的机器上时，
    # 必须把它的地址加进来，否则所有请求都会按 Nginx 自己的 IP 判定
    trusted-proxies:
      - 127.0.0.1
      - "::1"
    # 同一用户两次签到之间的最小间隔（秒），挡的是误触与连点，不是恶意刷接口
    # （要刷得有账号，且记录挂在真实账号上可审计）。设为 <= 0 表示不做间隔限制
    min-interval-seconds: 60

  # ===== 刷题 =====
  # 与考勤 / 帖子同一纪律：全部给默认值、不做必填校验——
  # 刷题是附加能力，配置没写全时应用必须能正常启动。
  quiz:
    # 一轮默认题量：约 15–20 分钟，是「一次坐下来能刷完」的长度。
    # 再长会让用户中途放弃，而中途放弃的批次不产生任何统计价值
    default-size: 20
    # 一轮题量上限：防「一次拉全库」（随机模式要把范围内全部题 id 查出来再洗牌）。
    # 超限时**收敛到上限**而不是报错，与分页参数同一处理方式
    max-size: 100
    # 错题消解阈值：连续答对几次算「已掌握」。
    # 设 1 会让「已消解」失去意义（四选一蒙对概率 25%）；设 3 以上会让用户觉得刷不掉。
    # 取 2 是「一次可能是蒙的、两次大概率真会了」的折中
    resolve-streak: 2

  # ===== 帖子模块 =====
  post:
    # 是否启用 AI 内容审核（三分法）：AI 判「安全」自动放行、判「违规」自动驳回，
    # 判「灰色」或 AI 不可用时一律转人工。
    # 关闭后所有内容直接进人工队列——本地不配 AI Key 也能跑通发帖流程，
    # 也是线上模型故障时的紧急降级开关（改配置重启即可，不用改代码）
    ai-audit-enabled: ${POST_AI_AUDIT_ENABLED:true}
    # 送审正文的最大长度，超出部分截断后再交给模型。
    # 只影响「送审」这一步，入库与展示的正文始终是完整的
    audit-content-max-length: ${POST_AUDIT_CONTENT_MAX_LENGTH:2000}

  web:
    # 跨域来源白名单：逗号分隔，端口通配用 *；必须走 allowedOriginPatterns（见 CorsConfig）
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ===== Actuator 端点暴露范围（这是「安全边界」，不是调试开关）=====
# 改成 "*" 会让 /actuator/env（配置项）、/actuator/heapdump（堆转储，可能含密码与 token）
# 零鉴权对外开放。且这些端点由独立的 WebMvcEndpointHandlerMapping 处理，
# Sa-Token 的 MVC 拦截器对它**完全无效**——不能指望鉴权框架兜住它。
management:
  endpoints:
    web:
      exposure:
        include: health

# ===== 接口文档：默认关闭，dev 打开 =====
knife4j:
  enable: false
springdoc:
  api-docs:
    enabled: false

# ===== Sa-Token 认证框架 =====
# 键名与 cn.dev33.satoken.config.SaTokenConfig 字段一一对应（中划线 ↔ 驼峰）；
# 写错的键不会报错、只会被静默忽略，改完务必确认登录行为符合预期
sa-token:
  # 前后端契约：请求头与 Cookie 都叫 satoken，改动需前端与所有已登录客户端同步
  token-name: satoken
  timeout: 604800              # 7 天
  active-timeout: 1800         # 30 分钟无操作失效（与 timeout 是「且」的关系）
  is-concurrent: true          # 允许多端同时在线
  is-share: false              # 每次登录生成新 token，便于按设备维度踢人
  token-style: uuid
  is-read-cookie: true
  is-lasting-cookie: true
  is-log: false                # 鉴权日志：dev 打开，生产关闭（量大且含登录信息）

logging:
  level:
    root: info
    com.bhu.runshistudioweb: info    # dev 覆盖为 debug

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-not-delete-value: 0
      # 删除值必须是「每次都不同」的毫秒时间戳表达式，而非固定值 1——
      # 否则同一账号第二次删除会与历史已删除行的 (account, deleted_at) 撞唯一索引 uk_account_deleted
      logic-delete-value: "CAST(UNIX_TIMESTAMP(NOW(3))*1000 AS SIGNED)"
